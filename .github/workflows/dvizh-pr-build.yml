name: Dvizh feature typecheck
on:
  push:
    branches: [feat/dvizh-replies-mentions-20261022]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: python3 -m py_compile backend_v2/main.py backend_v2/access_guard.py
