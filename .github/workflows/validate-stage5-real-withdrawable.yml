name: Validate Real CPA Withdrawal Gate PostgreSQL 17
on:
  pull_request:
    branches: [main, feat/stage5-2-isolated-cpa-ledger]
    paths:
      - 'backend_v2/main.py'
      - 'backend_v2/cpa_real_withdrawals.py'
      - 'backend_v2/migrations/20261017_stage5_real_withdrawable_guard.sql'
      - 'backend_v2/tests/test_stage5_real_withdrawals.py'
      - '.github/workflows/validate-stage5-real-withdrawable.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  real-withdrawable:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: cpa_withdrawals_isolated
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/cpa_withdrawals_isolated
      BOT_TOKEN: 123456:TEST_TOKEN_FOR_CI_ONLY
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install existing backend_v2 dependencies
        run: pip install -r backend_v2/requirements.txt
      - name: Compile new and existing route modules
        run: python -m py_compile backend_v2/main.py backend_v2/cpa_real_withdrawals.py
      - name: Run real-withdrawable concurrency, legacy, RLS and lifecycle tests
        run: python -m unittest discover -s backend_v2/tests -p 'test_stage5_real_withdrawals.py' -v
