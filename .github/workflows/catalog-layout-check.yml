name: Catalog mobile visual check
on:
  push:
    branches: [verify/compact-service-cards]
permissions:
  contents: read
jobs:
  screenshots:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install && npm install --no-save playwright@1.51.1
      - run: npx playwright install --with-deps chromium
      - name: Prepare isolated rendering of actual components
        run: |
          printf %s 'PCFkb2N0eXBlIGh0bWw+PGh0bWw+PGhlYWQ+PG1ldGEgbmFtZT0idmlld3BvcnQiIGNvbnRlbnQ9IndpZHRoPWRldmljZS13aWR0aCxpbml0aWFsLXNjYWxlPTEiLz48L2hlYWQ+PGJvZHk+PGRpdiBpZD0icm9vdCI+PC9kaXY+PHNjcmlwdCB0eXBlPSJtb2R1bGUiIHNyYz0iLy5jYXRhbG9nLXByZXZpZXcudHN4Ij48L3NjcmlwdD48L2JvZHk+PC9odG1sPgo=' | base64 -d > .catalog-preview.html
          printf %s '' | base64 -d > .catalog-preview.tsx
          printf %s '' | base64 -d > .catalog-data.json
          printf %s '' | base64 -d > .catalog-check.cjs
      - name: Check mobile layout, search and navigation
        run: |
          npm run dev -- --port 3014 --host 127.0.0.1 > /tmp/catalog-vite.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:3014/vvd-cpa/.catalog-preview.html > /dev/null && break || sleep 1; done
          node .catalog-check.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: catalog-mobile-screenshots
          path: catalog-*.png
