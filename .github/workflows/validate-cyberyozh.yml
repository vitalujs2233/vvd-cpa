name: CyberYozh preparation safety
on:
  pull_request:
    branches: [main]
    paths:
      - 'backend_v2/cyberyozh/**'
      - 'backend_v2/tests/test_cyberyozh.py'
      - 'backend_v2/migrations/*cyberyozh*'
      - 'src/pages/tools/CyberYozhPanels.tsx'
      - 'src/pages/tools/marketApi.ts'
      - 'tests/cyberyozh-ui.cjs'
      - '.github/workflows/validate-cyberyozh.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  mock-contracts-and-ledger:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: cyberyozh_isolated_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/cyberyozh_isolated_test
      BOT_TOKEN: 123456:TEST_ONLY
      PYTHONPATH: backend_v2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r backend_v2/requirements.txt
      - run: python -m unittest discover -s backend_v2/tests -p test_cyberyozh.py -v
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install --no-audit --no-fund
      - run: npm install --no-save --package-lock=false react-test-renderer@18.3.1
      - run: node --test tests/cyberyozh-ui.cjs
      - run: npm run build
