name: Traffic tags and attribution
on:
  push:
    branches: [feat/traffic-subs]
  pull_request:
    branches: [main]
    paths: ['backend_v2/neutral_links.py', 'backend_v2/cpa_analytics.py', 'backend_v2/tests/test_traffic_subs.py', 'src/pages/offers/**', 'src/pages/stats/**', '.github/workflows/validate-traffic-subs.yml']
permissions:
  contents: read
jobs:
  tags:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: traffic_subs_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/traffic_subs_test
      BOT_TOKEN: 123456:TEST_ONLY
      PYTHONPATH: backend_v2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r backend_v2/requirements.txt
      - run: python -m unittest discover -s backend_v2/tests -p test_traffic_subs.py -v
      - run: python -m unittest discover -s backend_v2/tests -p test_stage6_analytics.py -v
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install --no-audit --no-fund
      - run: npm run build
      - run: node scripts/check-traffic-tags.mjs
