name: Validate VVD CPA Stage 6 Analytics

on:
  push:
    branches: [feat/stage6-existing-analysis-analytics-draft]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analytics-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: cpa_stage6_isolated
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/cpa_stage6_isolated
      BOT_TOKEN: 123456:TEST_TOKEN_FOR_CI_ONLY
      PYTHONPATH: backend_v2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r backend_v2/requirements.txt
      - run: python -m unittest discover -s backend_v2/tests -p 'test_stage6*.py' -v

  mini-app-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install --no-audit --no-fund
      - run: npm run build
